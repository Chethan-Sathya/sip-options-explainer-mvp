name: Automated quality gate (non-live)
on:
  push:
  pull_request:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test policy, retrieval, AI mock acceptance and fallbacks
        run: python -m unittest discover -s tests -v
      - name: Evaluate 20 Golden Set-derived scenarios without an API key
        run: python evaluation/run_eval.py
      - name: Check all offline scenario outcomes
        run: |
          python - <<'PY'
          import json
          with open('evaluation/results_offline/metrics.json', encoding='utf-8') as f:
              m=json.load(f)
          assert m['total_cases']==20
          assert m['automatic_routing_and_gate_pass']==20
          assert m['expected_source_alignment_pass']==20
          assert not m['model_evaluation_executed']
          print('20/20 automatic route/safety/source checks passed; NOT a live AI accuracy estimate')
          PY
